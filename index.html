<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>KTX 소개</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>KTX (고속철도) 소개</h1>
      <p>KTX Introduction<br />빠르고 편리한 대한민국의 대표 고속철도</p>
    </header>

    <section class="main">
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/e/e7/KTX_%28Korea_Train_eXpress%29.jpg"
        alt="KTX 열차 이미지"
        width="80%"
      />
      <h2>KTX란?</h2>
      <p>
        KTX는 'Korea Train Express'의 줄임말로, 시속 300km 이상의 속도를
        자랑하는 대한민국의 고속철도입니다. 서울에서 부산까지 약 2시간 30분 만에
        도착할 수 있어 많은 사람들이 이용합니다.
      </p>
      <ul>
        <li>최고 속도: 약 305km/h</li>
        <li>운행 노선: 경부선, 호남선 등</li>
        <li>편의 시설: 와이파이, 좌석 전원, 화장실 등</li>
      </ul>
    </section>

    <footer>
      <p>&copy; 2025 KTX 소개 웹사이트</p>
    </footer>
  </body>
</html>
